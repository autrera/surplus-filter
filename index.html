<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surplus Models</title>
    <meta name="description" content="Select AI models from the Surplus Intelligence API">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="stylesheet" href="styles.css">
    <script defer src="code.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="dark-theme">
    <main class="app-container">
        <div class="glass-panel">
            <h1 class="title">Cheapest model offers</h1>
            <p class="subtitle">Pick models to compare the cheapest healthy offer for each.</p>

            <div x-data="multiSelect" class="multi-select-container" @click.away="open = false" @keydown.escape.window="open = false">
                <div class="dropdown-wrapper" @focusout="if (!$el.contains($event.relatedTarget)) open = false">
                    <div class="select-input-wrapper" @click="focusInput()">
                        <div class="selected-tags">
                        <template x-for="item in selected" :key="getModelKey(item)">
                            <span class="tag">
                                <span x-text="getModelName(item)"></span>
                                <button type="button" class="remove-tag" :aria-label="'Remove ' + getModelName(item)" @click.stop="removeOption(item)">&times;</button>
                            </span>
                        </template>
                        <input 
                            type="text" 
                            role="combobox"
                            aria-label="Search or select models"
                            aria-autocomplete="list"
                            aria-haspopup="listbox"
                            aria-controls="model-options"
                            :aria-expanded="open ? 'true' : 'false'"
                            :aria-activedescendant="open && highlightedIndex >= 0 && highlightedIndex < filteredOptions.length ? 'model-option-' + highlightedIndex : null"
                            x-model="search" 
                            x-ref="searchInput"
                            class="search-input" 
                            placeholder="Search or select models..." 
                            @click.stop="open = true"
                            @input="open = true"
                            @keydown.escape.window="open = false"
                            @keydown.enter.prevent="handleEnter()"
                            @keydown.arrow-down.prevent="highlightNext()"
                            @keydown.arrow-up.prevent="highlightPrev()"
                        />
                    </div>
                    <div class="chevron" :class="{'open': open}" @click.stop="open = !open">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                </div>

                <div x-show="open" x-transition.opacity class="dropdown-menu" x-cloak>
                    <div x-show="loading" class="loading-state">Loading models...</div>
                    <div x-show="!loading && filteredOptions.length === 0" class="empty-state">No models found.</div>
                    
                    <ul x-show="!loading && filteredOptions.length > 0" class="options-list" id="model-options" role="listbox" aria-label="Models" aria-multiselectable="true">
                        <template x-for="(option, index) in filteredOptions" :key="option">
                            <li 
                                role="option"
                                :id="'model-option-' + index"
                                :aria-selected="isSelected(option) ? 'true' : 'false'"
                                class="option-item" 
                                :class="{'selected': isSelected(option), 'highlighted': highlightedIndex === index}"
                                @click="toggleOption(option)"
                                @mouseenter="highlightedIndex = index"
                            >
                                <div class="checkbox">
                                    <svg x-show="isSelected(option)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <span x-text="option"></span>
                            </li>
                        </template>
                        </ul>
                    </div>
                </div>

                <div class="actions-container">
                    <span class="action-status" x-show="saveStatus" x-text="saveStatus" aria-hidden="true" x-cloak></span>
                    <button type="button" class="clear-btn" @click="clearSelected()" :disabled="selected.length === 0" x-show="selected.length > 0" x-cloak>
                        Clear
                    </button>
                    <button type="button" class="save-btn" @click="saveCurrentSet()" :disabled="selected.length === 0" x-show="selected.length > 0" x-cloak>
                        Save
                    </button>
                    <button type="button" class="search-btn" @click="performSearch()" :disabled="isSearching || selected.length === 0">
                        <span x-show="!isSearching">Search</span>
                        <span x-show="isSearching">Searching...</span>
                    </button>
                </div>

                <div x-show="savedSets.length > 0" class="saved-sets-container" x-cloak>
                    <h3 class="filter-title saved-sets-title">Saved sets</h3>
                    <div class="saved-sets-list">
                        <template x-for="(set, index) in savedSets" :key="index">
                            <div class="saved-set-card">
                                <div class="saved-set-models">
                                    <template x-for="model in set" :key="getModelKey(model)">
                                        <span class="tag" x-text="getModelName(model)"></span>
                                    </template>
                                </div>
                                <div class="saved-set-actions">
                                    <button type="button" class="load-set-btn" @click="loadSet(set)">Load</button>
                                    <button type="button" class="remove-set-btn" @click="removeSet(index)" title="Remove saved set" :aria-label="'Remove saved set: ' + set.map(m => getModelName(m)).join(', ')">&times;</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <div x-show="providers.length > 0" class="filters-container" x-cloak>
                    <details class="provider-details">
                        <summary class="filter-summary">
                            <span class="filter-title" x-text="selectedProviders.length > 0 ? 'Filter by provider · ' + selectedProviders.length + ' selected' : 'Filter by provider (' + providers.length + ')'"></span>
                        </summary>
                        <div class="filter-header">
                            <div class="filter-actions">
                                <button type="button" class="provider-action-btn" @click="selectAllProviders()">All</button>
                                <button type="button" class="provider-action-btn" @click="selectTrustedProviders()" title="Select only providers curated as trusted by Surplus Intelligence" x-show="trustedProviders.length > 0" x-cloak>Trusted</button>
                                <button type="button" class="provider-action-btn" @click="clearProviders()" x-show="selectedProviders.length > 0" x-cloak>None</button>
                            </div>
                        </div>
                        <div class="filter-tags">
                            <template x-for="provider in providers" :key="provider">
                                <label class="provider-filter">
                                    <input type="checkbox" :checked="selectedProviders.includes(provider)" @change="toggleProvider(provider)" />
                                    <span x-text="provider"></span>
                                    <span class="trusted-badge" x-show="isTrustedProvider(provider)">Trusted</span>
                                </label>
                            </template>
                        </div>
                    </details>
                </div>

                <div x-show="hiddenByFilterCount > 0" class="filter-note" x-cloak>
                    <span x-text="hiddenByFilterCount + (hiddenByFilterCount === 1 ? ' model' : ' models') + ' hidden by provider filter'"></span>
                    <span aria-hidden="true">&middot;</span>
                    <button type="button" class="link-btn" @click="clearProviders()">Show all</button>
                </div>

                <div x-show="results.length > 0" class="results-container" x-cloak>
                    <template x-for="result in filteredResults" :key="result._key">
                        <div class="result-card" :class="'card-' + result.status">
                            <div class="result-header">
                                <h3 class="result-title">
                                    <span x-text="result.name"></span>
                                    <span class="result-id" x-text="result.id"></span>
                                    <button @click.prevent="copyToClipboard(result.id, $event)" class="copy-btn" :title="'Copy model ID ' + result.id" :aria-label="'Copy model ID ' + result.id">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                    </button>
                                </h3>
                            </div>

                            <div x-show="result.status === 'loading'" class="card-state card-loading">
                                <div class="spinner"></div>
                                <span>Fetching best offer...</span>
                            </div>

                            <div x-show="result.status === 'unavailable'" class="card-state card-unavailable">
                                No offers available
                            </div>

                            <template x-if="result.status === 'loaded' && bestOffer(result)">
                                <div class="result-body">
                                    <div class="provider-info">
                                        <span class="provider-label">Provider</span>
                                        <span class="provider-value provider-name">
                                            <span x-text="bestOffer(result).provider"></span>
                                            <span class="trusted-badge" x-show="isTrustedProvider(bestOffer(result).provider)">Trusted</span>
                                        </span>
                                        <div class="result-price" x-text="'Total / 1M:&nbsp;' + formatPrice(bestOffer(result).price)"></div>
                                    </div>
                                    <div class="price-details">
                                        <div class="price-item">
                                            <span class="provider-label">Input (1M)</span>
                                            <span class="provider-value" x-text="formatPrice(bestOffer(result).input_price)"></span>
                                        </div>
                                        <div class="price-item">
                                            <span class="provider-label">Output (1M)</span>
                                            <span class="provider-value" x-text="formatPrice(bestOffer(result).output_price)"></span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
                
                <div x-show="!isSearching && searchComplete && results.length > 0 && filteredResults.length === 0" class="empty-state" x-cloak>
                    No offers match the current provider filter.
                </div>
                
                <div x-show="!isSearching && searchComplete && results.length === 0" class="empty-state" x-cloak>
                    No offers found.
                </div>
                
                <div x-show="cacheAgeMessage" x-text="cacheAgeMessage" class="cache-footer" x-cloak></div>

                <div class="sr-only" role="status" aria-live="polite" aria-atomic="true" x-text="liveMessage"></div>
            </div>
        </div>
    </main>
</body>
</html>
